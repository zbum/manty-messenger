<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90FF"/>
      <stop offset="100%" style="stop-color:#0062E6"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8F0FE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#003DA0" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Chat bubble -->
  <g filter="url(#shadow)">
    <path d="M100 140 C100 112, 124 88, 152 88 L360 88 C388 88, 412 112, 412 140 L412 300 C412 328, 388 352, 360 352 L220 352 L148 410 L148 352 L152 352 C124 352, 100 328, 100 300 Z" fill="url(#bubble)"/>
  </g>

  <!-- 만톡 text -->
  <text x="256" y="248" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="108" font-weight="800" fill="#0062E6" text-anchor="middle" letter-spacing="-2">만톡</text>

  <!-- Small decorative dots (chat indicator) -->
  <circle cx="196" cy="395" r="12" fill="rgba(255,255,255,0.6)"/>
  <circle cx="148" cy="430" r="8" fill="rgba(255,255,255,0.4)"/>
</svg>
